<table class="table table-hover bg-white align-middle mb-0">
    <thead class="table-light">
        <tr>
            <th>Tipo</th>
            <th>Infração</th>
            <th>Nome</th>
            <th>CPF/CNPJ</th>
            <th>Data</th>
            <th class="text-end">Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for reg in registros %}
        <tr>
            <td><span class="fw-bold text-secondary">{{ reg.tipo }}</span></td>
            <td>
                <span class="badge bg-secondary text-uppercase">{{ reg.inciso }}</span>
            </td>
            <td>{{ reg.nome }}</td>
            <td>{{ reg.cpf }}</td>
            <td>{{ reg.data }}</td>
            <td class="text-end">
                <a href="/gerar/{{ reg.id }}" class="btn btn-sm btn-primary shadow-sm">Gerar Doc</a>
                {% if auth %}
                <button
                    hx-get="/editar/{{ reg.id }}"
                    hx-target="#container-formulario"
                    class="btn btn-sm btn-warning shadow-sm"
                >
                    Editar
                </button>
                <button
                    hx-delete="/deletar/{{ reg.id }}"
                    hx-target="#container-tabela"
                    hx-confirm="Tem certeza que deseja excluir este registro?"
                    class="btn btn-sm btn-danger shadow-sm"
                >
                    X
                </button>
                {% endif %}
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="6" class="text-center text-muted py-5">
                Nenhum registro encontrado no sistema.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
